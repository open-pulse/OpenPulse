[project]
name = "pulse"
version = "2.0.12"
description = "Open Source Software for Pulsation Analysis of Pipeline Systems"
authors = [
    { name = "Olavo Silva", email = "olavus@gmail.com" },
    { name = "Jacson Gil Vargas", email = "jgvargasemc@gmail.com" },
    { name = "André Fernandes", email = "fpf.andre@gmail.com" },
    { name = "Danilo Espindola", email = "daniloespindola.grad@gmail.com" },
    { name = "Vitor Voigt Slongo", email = "v.v.slongo@gmail.com" },
    { name = "Rodrigo Schwartz", email = "rodrigo32003@gmail.com" },
    { name = "Gildean Almeida", email = "gildean185@gmail.com" },
    { name = "Fabrício Cruz", email = "fabricioemanuelcruzz@gmail.com" },
]
requires-python = ">=3.10,<3.14"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "vtk (>=9,<9.5)",
    "numpy>=2.1.2,<3",
    "scipy>=1.11.2,<2",
    "matplotlib>=3.7.2,<4",
    "gmsh>=4.13.1,<5",
    "ctREFPROP>=0.10.2,<0.11",
    "pandas>=2.1.0,<3",
    "openpyxl>=3.1.2,<4",
    "h5py>=3.12.1,<4",
    "molde ; python_full_version >= '3.10'",
    "pyqtdarktheme>=2.1.0,<3 ; python_full_version >= '3.10' and python_full_version < '3.12'",
    "fileboxes>=0.1.4,<0.2",
    "ordered-set>=4.1.0,<5",
    "pypardiso-mopt>=0.1.0,<0.2",
    "pyside6>=6.8.1.1,<7",
    "polars>=1.37.1,<2",
    "pyarrow>=23.0.0,<24",
    "fastexcel>=0.19.0",
    "pint>=0.24.4",
]

[project.scripts]
pulse = "pulse.launch:main"

[dependency-groups]
dev = [
    "black>=24.3.0,<25",
    "isort>=5.12.0,<6",
    "pytest>=7.4.1,<8",
    "pytest-datadir>=1.7.2,<2",
    "pytest-regressions>=2.5.0,<3",
    "pyinstaller>=6.4.0,<7 ; python_full_version >= '3.10' and python_full_version < '3.14'",
    "tuna>=0.5.11,<0.6",
    "invoke>=2.2.1",
    "ruff>=0.15.0",
]

[tool.uv]

[tool.uv.sources]
molde = { git = "https://github.com/andrefpf/molde.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.isort]
profile = "black"

[tool.ruff]
exclude = [
    "__pycache__",
    "pulse/interface/ui_generated",
]
